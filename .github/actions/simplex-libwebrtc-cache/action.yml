name: 'Restore libwebrtc'

description: 'Restore the libwebrtc install directory of one platform from the cache'

inputs:
  platform-name:
    description: 'The target platform.'
    required: true

outputs:
  cache-hit:
    description: 'Whether the primary key matched.'
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: 'The key to save a fresh build under.'
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-matched-key:
    description: 'The key that was restored, empty on a miss.'
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: "composite"
  steps:
    - id: branch
      name: Derive the WebRTC branch from the pom
      run: echo "name=$(sed -n 's|.*<webrtc.branch>branch-heads/\([^<]*\)</webrtc.branch>.*|\1|p' webrtc-jni/pom.xml)" >> "$GITHUB_OUTPUT"
      shell: bash

    # The path is the default webrtc.install.dir of webrtc-jni/pom.xml. A pom
    # change alone falls back to the previous build of the same CMake files.
    - id: restore
      name: Restore libwebrtc cache
      uses: actions/cache/restore@v6
      with:
        path: ~/webrtc/build
        key: webrtc-${{ steps.branch.outputs.name }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt', 'webrtc-jni/src/main/cpp/dependencies/webrtc/patches/**') }}-${{ hashFiles('webrtc-jni/pom.xml') }}
        restore-keys: webrtc-${{ steps.branch.outputs.name }}-${{ inputs.platform-name }}-${{ hashFiles('webrtc-jni/src/main/cpp/dependencies/webrtc/CMakeLists.txt', 'webrtc-jni/src/main/cpp/dependencies/webrtc/patches/**') }}-
